services:
  ad5-companion:
    build:
      context: .
    ports:
      - "${AD5_PORT:-8090}:80"
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /var/cache/nginx
      - /var/run
      - /tmp
    security_opt:
      - no-new-privileges:true

  reminder:
    profiles: ["reminder"]
    build:
      context: ./reminder
    environment:
      REMINDER_RECIPIENT: "${REMINDER_RECIPIENT:-}"
      REMINDER_FROM: "${REMINDER_FROM:-}"
      REMINDER_SUBJECT: "${REMINDER_SUBJECT:-EPSO AD5 — your daily study loop}"
      REMINDER_TIME: "${REMINDER_TIME:-19:00}"
      REMINDER_TIMEZONE: "${REMINDER_TIMEZONE:-Europe/Paris}"
      REMINDER_APP_URL: "${REMINDER_APP_URL:-http://localhost:8090}"
      SMTP_HOST: "${SMTP_HOST:-}"
      SMTP_PORT: "${SMTP_PORT:-587}"
      SMTP_SECURITY: "${SMTP_SECURITY:-starttls}"
      SMTP_USERNAME: "${SMTP_USERNAME:-}"
      SMTP_PASSWORD: "${SMTP_PASSWORD:-}"
      SMTP_TIMEOUT_SECONDS: "${SMTP_TIMEOUT_SECONDS:-30}"
    restart: unless-stopped
    init: true
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
